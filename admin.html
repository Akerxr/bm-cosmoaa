<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - BM Cosmetics</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Cairo', sans-serif; background: #fff5f8; padding: 20px; color: #333; }
    .card { max-width: 500px; margin: 30px auto; background: #fff; padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    h2 { color: #d81b60; text-align: center; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: inherit; }
    button { width: 100%; background: #d81b60; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
    button:disabled { background: #ccc; }
    #msg { text-align: center; margin-top: 15px; font-weight: bold; line-height: 1.6; word-break: break-all; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🎀 إضافة منتج جديد</h2>
    <div class="form-group">
      <label>اسم المنتج</label>
      <input type="text" id="p-name" placeholder="مثال: CeraVe Lotion">
    </div>
    <div class="form-group">
      <label>القسم</label>
      <select id="p-category">
        <option value="Skin Care">Skin Care</option>
        <option value="Hair Care">Hair Care</option>
        <option value="Body Care">Body Care</option>
        <option value="Kids">Kids</option>
        <option value="Korean">Korean</option>
      </select>
    </div>
    <div class="form-group">
      <label>السعر الجديد (EGP)</label>
      <input type="number" id="p-price" placeholder="250">
    </div>
    <div class="form-group">
      <label>السعر القديم (اختياري)</label>
      <input type="number" id="p-old-price" placeholder="300">
    </div>
    <div class="form-group">
      <label>اختر صورة المنتج من جهازك</label>
      <input type="file" id="p-file" accept="image/*">
    </div>
    <button id="submit-btn" onclick="uploadProduct()">إضافة المنتج فوراً</button>
    <div id="msg"></div>
  </div>

<script>
  const SUPABASE_URL = "https://gcwkmsegnscwgwmmdal.supabase.co";
  const SUPABASE_KEY = "Sb_publishable_nlMoUgTSPQLfUzR67JxbZQ_3MKPV_OA";
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function uploadProduct() {
    const name = document.getElementById("p-name").value.trim();
    const category = document.getElementById("p-category").value;
    const price = document.getElementById("p-price").value;
    const oldPrice = document.getElementById("p-old-price").value;
    const fileInput = document.getElementById("p-file");
    const msg = document.getElementById("msg");
    const btn = document.getElementById("submit-btn");

    if (!name || !price || !fileInput.files[0]) {
      msg.style.color = "red";
      msg.innerText = "من فضلك املأ كل البيانات واختر صورة للمنتج";
      return;
    }

    btn.disabled = true;
    msg.style.color = "#333";
    msg.innerText = "جاري رفع الصورة والبيانات...";

    try {
      const file = fileInput.files[0];
      const fileExt = file.name.split('.').pop().toLowerCase() || 'jpg';
      const cleanFileName = `img_${Date.now()}.${fileExt}`;
      const arrayBuffer = await file.arrayBuffer();

      // 1. رفع الصورة إلى Storage
      const { data: imgData, error: imgErr } = await _supabase.storage
        .from("products")
        .upload(cleanFileName, arrayBuffer, {
          contentType: file.type || 'image/jpeg',
          upsert: true
        });

      if (imgErr) {
        // تحليل خطأ الـ Storage
        console.error("Storage Error:", imgErr);
        let errorMsg = imgErr.message || JSON.stringify(imgErr);
        if (errorMsg.includes("row-level security") || errorMsg.includes("policy") || errorMsg.includes("Access Denied") || errorMsg.includes("Unauthorized")) {
          throw new Error("مشكلة سياسة (Storage Policy): صلاحيات الرفع على مخزن الصور غير مفعلة أو محظورة في Supabase.");
        } else if (errorMsg.includes("Invalid API key") || errorMsg.includes("JWT") || errorMsg.includes("apikey")) {
          throw new Error("مشكلة API (API Key): مفتاح الربط أو رابط Supabase غير صحيح.");
        } else {
          throw new Error("مشكلة في رفع الصورة (Storage): " + errorMsg);
        }
      }

      const imageUrl = `${SUPABASE_URL}/storage/v1/object/public/products/${cleanFileName}`;

      // 2. إدخال بيانات المنتج في Database
      const { error: dbErr } = await _supabase.from("products").insert([{
        name: name,
        category: category,
        new_price: Number(price),
        old_price: oldPrice ? Number(oldPrice) : null,
        image_url: imageUrl
      }]);

      if (dbErr) {
        // تحليل خطأ الـ Database
        console.error("Database Error:", dbErr);
        let dbErrorMsg = dbErr.message || JSON.stringify(dbErr);
        if (dbErrorMsg.includes("row-level security") || dbErrorMsg.includes("policy")) {
          throw new Error("مشكلة سياسة (Database Policy): جدول المنتجات يحتاج لضبط سياسات RLS الخاصة به.");
        } else if (dbErrorMsg.includes("API key") || dbErrorMsg.includes("JWT")) {
          throw new Error("مشكلة API (API Key): مفتاح الربط غير صالح للتعامل مع قاعدة البيانات.");
        } else {
          throw new Error("مشكلة في قاعدة البيانات (Database): " + dbErrorMsg);
        }
      }

      msg.style.color = "green";
      msg.innerText = "تمت إضافة المنتج بنجاح! 🎉";
      document.getElementById("p-name").value = "";
      document.getElementById("p-price").value = "";
      document.getElementById("p-old-price").value = "";
      fileInput.value = "";
    } catch (err) {
      console.error(err);
      msg.style.color = "red";
      msg.innerText = err.message || "حدث خطأ غير معروف أثناء الرفع.";
    } finally {
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
