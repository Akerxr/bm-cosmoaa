<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - BM Cosmetics</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Cairo', sans-serif; background: #fff5f8; padding: 20px; color: #333; }
    .card { max-width: 500px; margin: 30px auto; background: #fff; padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    h2 { color: #d81b60; text-align: center; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: inherit; }
    button { width: 100%; background: #d81b60; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
    button:disabled { background: #ccc; }
    #msg { text-align: center; margin-top: 15px; font-weight: bold; word-break: break-all; }
    .img-preview { width: 100%; height: 150px; border: 2px dashed #ddd; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-top: 5px; overflow: hidden; background: #fafafa; }
    .img-preview img { width: 100%; height: 100%; object-fit: contain; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🎀 إضافة منتج جديد</h2>
    <div class="form-group">
      <label>اسم المنتج</label>
      <input type="text" id="p-name" placeholder="مثال: CeraVe Lotion">
    </div>
    <div class="form-group">
      <label>القسم</label>
      <select id="p-category">
        <option value="Skin Care">Skin Care</option>
        <option value="Hair Care">Hair Care</option>
        <option value="Body Care">Body Care</option>
        <option value="Kids">Kids</option>
        <option value="Korean">Korean</option>
      </select>
    </div>
    <div class="form-group">
      <label>السعر الجديد (EGP)</label>
      <input type="number" id="p-price" placeholder="250">
    </div>
    <div class="form-group">
      <label>السعر القديم (اختياري)</label>
      <input type="number" id="p-old-price" placeholder="300">
    </div>
    <div class="form-group">
      <label>رابط الصورة (Image URL)</label>
      <input type="url" id="p-image" placeholder="https://i.postimg.cc/..." oninput="previewImage(this.value)">
      <div class="img-preview" id="preview-box">
        <span style="color: #999; font-size: 13px;">معاينة الصورة ستظهر هنا</span>
      </div>
    </div>
    <button id="submit-btn" onclick="uploadProduct()">إضافة المنتج فوراً</button>
    <div id="msg"></div>
  </div>

<script>
  const SUPABASE_URL = "https://gcwkmsegnscwgwmmdal.supabase.co";
  const SUPABASE_KEY = "Sb_publishable_nlMoUgTSPQLfUzR67JxbZQ_3MKPV_OA";
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function previewImage(url) {
    const box = document.getElementById("preview-box");
    if (url.trim() !== "") {
      box.innerHTML = `<img src="${url}" alt="Preview" onerror="this.onerror=null; this.parentNode.innerHTML='<span style=\'color:red; font-size:12px;\'>رابط الصورة غير صالح</span>';">`;
    } else {
      box.innerHTML = `<span style="color: #999; font-size: 13px;">معاينة الصورة ستظهر هنا</span>`;
    }
  }

  async function uploadProduct() {
    const name = document.getElementById("p-name").value.trim();
    const category = document.getElementById("p-category").value;
    const price = document.getElementById("p-price").value;
    const oldPrice = document.getElementById("p-old-price").value;
    const imageUrl = document.getElementById("p-image").value.trim();
    const msg = document.getElementById("msg");
    const btn = document.getElementById("submit-btn");

    if (!name || !price || !imageUrl) {
      msg.style.color = "red";
      msg.innerText = "من فضلك املأ كل البيانات واكتب رابط الصورة";
      return;
    }

    btn.disabled = true;
    msg.style.color = "#333";
    msg.innerText = "جاري إضافة المنتج...";

    try {
      // إدخال البيانات مباشرة في قاعدة البيانات بدون مشاكل رفع الـ Storage
      const { error: dbErr } = await _supabase.from("products").insert([{
        name: name,
        category: category,
        new_price: Number(price),
        old_price: oldPrice ? Number(oldPrice) : null,
        image_url: imageUrl
      }]);

      if (dbErr) throw dbErr;

      msg.style.color = "green";
      msg.innerText = "تمت إضافة المنتج بنجاح! 🎉";
      document.getElementById("p-name").value = "";
      document.getElementById("p-price").value = "";
      document.getElementById("p-old-price").value = "";
      document.getElementById("p-image").value = "";
      document.getElementById("preview-box").innerHTML = `<span style="color: #999; font-size: 13px;">معاينة الصورة ستظهر هنا</span>`;
    } catch (err) {
      console.error(err);
      msg.style.color = "red";
      msg.innerText = "حدث خطأ: " + (err.message || JSON.stringify(err));
    } finally {
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
